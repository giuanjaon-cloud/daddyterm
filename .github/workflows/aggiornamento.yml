name: Aggiornamento Palinsesto

on:
  schedule:
    # Esegue lo script ogni 3 ore (al minuto 0)
    - cron: '0 */3 * * *'
  # Permette di avviare il workflow anche manualmente dal pannello "Actions"
  workflow_dispatch: 

permissions:
  contents: write # Autorizzazione necessaria per fare il commit e caricare il file

jobs:
  update-palinsesto:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione delle librerie necessarie
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Esecuzione dello script daddyterm.py
        run: python daddyterm.py

      - name: Commit e push del nuovo palinsesto.html
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add palinsesto.html
          # Verifica se ci sono state effettive modifiche al file prima di fare il commit, per evitare errori
          git diff --quiet && git diff --staged --quiet || git commit -m "🔄 Aggiornamento automatico palinsesto.html"
          git push
